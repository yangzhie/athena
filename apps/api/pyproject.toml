[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "athena-api"
version = "0.1.0"
description = "Athena's API service (FastAPI modular monolith). Starts with the SRS module."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "pydantic>=2.12,<3",
    "fsrs>=6,<7",
    "athena-agent",
    "openai>=2,<3",
]

[project.scripts]
athena-srs = "athena_api.srs.cli:main"
athena-lectures = "athena_api.lectures.cli:main"

[dependency-groups]
dev = ["pytest>=8.3,<10", "httpx>=0.27,<1"]

[tool.uv.sources]
# The adaptive learning agent (agent/), used in-process as the tutor.
athena-agent = { path = "../../agent", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["src/athena_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
